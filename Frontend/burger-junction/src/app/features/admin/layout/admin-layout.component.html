<div class="admin-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 8.5h12"></path>
          <path d="M7 8.5a5 5 0 0 1 10 0"></path>
          <path d="M5 8.5h14l-1 9H6l-1-9Z"></path>
          <path d="M9 12h.01"></path>
          <path d="M12 12h.01"></path>
          <path d="M15 12h.01"></path>
        </svg>
      </div>

      <div>
        <h2>Burger Junction</h2>
        <span>Admin Panel</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="nav-menu">
      <div class="nav-section-title">MAIN</div>

      <!-- Dashboard -->
      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </span>

        <span>Dashboard</span>
      </a>

      <!-- Products -->
      <a
        routerLink="/admin/products"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 3v6"></path>
            <path d="M4 3v4a3 3 0 0 0 6 0V3"></path>
            <path d="M7 10v11"></path>
            <path d="M17 3v18"></path>
            <path d="M17 3a4 4 0 0 0 0 8"></path>
          </svg>
        </span>

        <span>Products</span>
      </a>

      <!-- Categories -->
      <a
        routerLink="/admin/categories"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20 12l-8 8-9-9V4h7l10 8Z"></path>
            <circle cx="7.5" cy="8.5" r="1"></circle>
          </svg>
        </span>

        <span>Categories</span>
      </a>

      <!-- Orders -->
      <a routerLink="/admin/orders" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 3h12v18H6z"></path>
            <path d="M9 7h6"></path>
            <path d="M9 11h6"></path>
            <path d="M9 15h4"></path>
          </svg>
        </span>

        <span>Orders</span>
      </a>

      <!-- Inventory -->
      <a
        routerLink="/admin/inventory"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 6h18"></path>
            <path d="M3 12h18"></path>
            <path d="M3 18h18"></path>
            <rect x="5" y="4" width="14" height="16" rx="2"></rect>
          </svg>
        </span>

        <span>Inventory</span>
      </a>

      <!-- Management -->
      <div class="nav-section-title">MANAGEMENT</div>

      <!-- Customers -->
      <a
        routerLink="/admin/customers"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"></path>
            <circle cx="9.5" cy="7" r="4"></circle>
            <path d="M17 11a4 4 0 1 0 0-8"></path>
            <path d="M21 21v-2a4 4 0 0 0-3-3.87"></path>
          </svg>
        </span>

        <span>Customers</span>
      </a>

      <!-- Riders -->
      <a routerLink="/admin/riders" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="9" cy="7" r="3"></circle>
            <path d="M4 21v-2a5 5 0 0 1 10 0v2"></path>
            <path d="M15 8h3l3 3v4h-2"></path>
            <circle cx="18" cy="18" r="2"></circle>
            <circle cx="7" cy="18" r="2"></circle>
            <path d="M9 14h6"></path>
          </svg>
        </span>

        <span>Riders</span>
      </a>

      <!-- Coupons -->
      <a routerLink="/admin/coupons" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M20 12a2 2 0 0 0 0-4V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3Z"
            ></path>
            <path d="M13 5l-4 6"></path>
            <path d="M10 7h.01"></path>
            <path d="M14 13h.01"></path>
          </svg>
        </span>

        <span>Coupons</span>
      </a>

      <a
        routerLink="/admin/analytics"
        routerLinkActive="active"
        class="nav-item"
      >
        <svg
          class="nav-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M4 19V5"></path>
          <path d="M4 19h16"></path>
          <path d="M8 16v-5"></path>
          <path d="M12 16V8"></path>
          <path d="M16 16v-8"></path>
          <path d="M20 16v-4"></path>
        </svg>

        <span>Analytics</span>
      </a>

      <!-- Services -->
      <a
        routerLink="/admin/services"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.41 1.41-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.41-1.41.06-.06A1.7 1.7 0 0 0 9.4 15a1.7 1.7 0 0 0-1.56-1.03H7v-2h.84A1.7 1.7 0 0 0 9.4 11a1.7 1.7 0 0 0-.34-1.88L9 9.06l1.41-1.41.06.06A1.7 1.7 0 0 0 12.35 8.4 1.7 1.7 0 0 0 13.38 6.84V6h2v.84A1.7 1.7 0 0 0 16.41 8.4a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.41 1.41-.06.06A1.7 1.7 0 0 0 19.4 11a1.7 1.7 0 0 0 1.56 1.03H22v2h-1.04A1.7 1.7 0 0 0 19.4 15Z"
            ></path>
          </svg>
        </span>

        <span>Services</span>
      </a>
    </nav>

    <!-- Sidebar Bottom -->
    <!-- Sidebar Bottom -->
    <div class="sidebar-bottom">
      <!-- Admin Profile -->
      <div class="profile-wrapper">
        <button
          type="button"
          class="admin-profile"
          (click)="toggleProfileMenu()"
          [attr.aria-expanded]="profileMenuOpen"
        >
          <div class="avatar">A</div>

          <div class="admin-info">
            <strong>Administrator</strong>
            <span>Admin</span>
          </div>

          <svg
            class="profile-chevron"
            [class.open]="profileMenuOpen"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>

        <!-- Profile Dropdown -->
        @if (profileMenuOpen) {
          <div class="profile-dropdown">
            <div class="dropdown-header">
              <div class="dropdown-avatar">A</div>

              <div>
                <strong>Administrator</strong>
                <span>Admin</span>
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <!-- My Profile -->
            <button
              type="button"
              class="dropdown-item"
              routerLink="/admin/profile"
              (click)="closeProfileMenu()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 21a8 8 0 0 0-16 0"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>

              <span>My Profile</span>
            </button>

            <!-- Settings -->
            <button
              type="button"
              class="dropdown-item"
              routerLink="/admin/settings"
              (click)="closeProfileMenu()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.41 1.41-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V20h-2v-.09a1.7 1.7 0 0 0-1.03-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-1.41-1.41.06-.06A1.7 1.7 0 0 0 9.4 15a1.7 1.7 0 0 0-1.56-1.03H7v-2h.84A1.7 1.7 0 0 0 9.4 11a1.7 1.7 0 0 0-.34-1.88L9 9.06l1.41-1.41.06.06A1.7 1.7 0 0 0 12.35 8.4 1.7 1.7 0 0 0 13.38 6.84V6h2v.84A1.7 1.7 0 0 0 16.41 8.4a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.41 1.41-.06.06A1.7 1.7 0 0 0 19.4 11a1.7 1.7 0 0 0 1.56 1.03H22v2h-1.04A1.7 1.7 0 0 0 19.4 15Z"
                ></path>
              </svg>

              <span>Settings</span>
            </button>

            <!-- Change Password -->
            <button
              type="button"
              class="dropdown-item"
              routerLink="/admin/profile"
              (click)="closeProfileMenu()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                <circle cx="12" cy="16" r="1"></circle>
              </svg>

              <span>Change Password</span>
            </button>

            <div class="dropdown-divider"></div>

            <!-- Logout -->
            <button
              type="button"
              class="dropdown-item logout-item"
              (click)="logout()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M21 19V5a2 2 0 0 0-2-2h-6"></path>
              </svg>

              <span>Logout</span>
            </button>
          </div>
        }
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <!-- Topbar -->
    <header class="topbar">
      <div>
        <span class="topbar-label">BURGER JUNCTION</span>
        <h1>Admin Panel</h1>
      </div>

      <div class="topbar-right">
        <span class="status-dot"></span>
        <span>System Online</span>
      </div>
    </header>

    <!-- Page Content -->
    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
